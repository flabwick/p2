<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <!-- Pocket body: open top, no horizontal line -->
  <path d="M 15 58 L 15 92 Q 15 118 60 125 Q 105 118 105 92 L 105 58"
        fill="none" stroke="#333" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Flap: smooth arch curving down to central point (no fill) -->
  <path d="M 15 58 Q 15 34 60 47 Q 105 34 105 58 Q 82 73 60 79 Q 38 73 15 58 Z"
        fill="none" stroke="#333" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Transparent mask circle to clear flap stroke beneath the plus region (now larger to accommodate plus) -->
  <circle cx="60" cy="79" r="10" fill="white"/>

  <!-- Plus icon: bold cross at center, cleanly overlaying the flap -->
  <path d="M 60 69 L 60 89 M 50 79 L 70 79" 
        stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
</svg>