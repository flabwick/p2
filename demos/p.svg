<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 145" width="120" height="145">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A882"/>
      <stop offset="60%" stop-color="#B8926A"/>
      <stop offset="100%" stop-color="#9E7A52"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF9870"/>
      <stop offset="100%" stop-color="#8E6840"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B483"/>
      <stop offset="100%" stop-color="#A07840"/>
    </linearGradient>
    <filter id="bodyShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="flapShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="btnShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000050"/>
    </filter>
  </defs>

  <!-- Pocket body: top at y=55, bottom curves to ~y=141, midpoint ~y=98 -->
  <path d="M 10 55 L 10 104 Q 10 134 60 141 Q 110 134 110 104 L 110 55 Z"
        fill="url(#bodyGrad)" filter="url(#bodyShadow)"
        stroke="#8A6035" stroke-width="1.2"/>

  <!-- Inner stitching on body -->
  <path d="M 19 62 L 19 102 Q 19 124 60 131 Q 101 124 101 102 L 101 62"
        fill="none" stroke="#F5DEB355" stroke-width="1"
        stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- P centred vertically in body (top=55, bottom=141, mid=98) using dominant-baseline -->
  <text x="60" y="98"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="62"
        font-style="italic"
        text-anchor="middle"
        dominant-baseline="central"
        fill="#6B4520"
        opacity="0.75">P</text>

  <!-- Flap: shallow lip -->
  <path d="M 10 55
           Q 10 42 60 48
           Q 110 42 110 55
           Q 85 63 60 67
           Q 35 63 10 55 Z"
        fill="url(#flapGrad)" filter="url(#flapShadow)"
        stroke="#7A5528" stroke-width="1.2"/>

  <!-- Subtle stitching on flap -->
  <path d="M 18 54
           Q 18 44 60 50
           Q 102 44 102 54
           Q 80 61 60 65
           Q 40 61 18 54 Z"
        fill="none" stroke="#F5DEB340" stroke-width="1"
        stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- Button -->
  <circle cx="60" cy="67" r="5.5" fill="url(#btnGrad)" stroke="#7A5528" stroke-width="1" filter="url(#btnShadow)"/>
  <ellipse cx="58.5" cy="65" rx="2.2" ry="1.5" fill="#ffffff35"/>
  <circle cx="60" cy="67" r="1.5" fill="none" stroke="#7A552888" stroke-width="0.8"/>
</svg>