<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paper · digital · neo‑brutalist icons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5e9d8; /* antique oatmeal */
            font-family: 'Courier New', Courier, 'IBM Plex Mono', monospace;
            padding: 3rem 2rem;
            color: #1e1e1e;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            border-bottom: 6px solid #1e1e1e;
            padding-bottom: 0.75rem;
            display: inline-block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
        }

        .icon-card {
            background: #fffef7; /* soft white */
            border: 4px solid #1e1e1e;
            outline: 2px solid #1e1e1e;
            outline-offset: 4px;
            padding: 2rem 1.5rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 8px 8px 0 0 #1e1e1e;
        }

        /* physical press on click (optional) */
        .icon-card:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0 0 #1e1e1e;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            stroke: #1e1e1e;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* accent colours for some icons – desaturated pastels */
        .accent-fill {
            fill: #e0b7a2; /* dusty rose */
            stroke: #1e1e1e;
        }
        .accent-fill-secondary {
            fill: #b8c9c1; /* faded sage */
            stroke: #1e1e1e;
        }
        .accent-stroke {
            stroke: #c25b3a; /* bold terracotta */
            stroke-width: 3.5;
        }

        .icon-label {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: #1e1e1e;
            color: #fffef7;
            padding: 0.4rem 0.8rem;
            border: 2px solid #1e1e1e;
            margin-top: 0.5rem;
            text-align: center;
            width: 100%;
        }

        /* special animations */
        .refresh-hover:hover .curl-corner {
            transform: translate(-2px, -2px);
            transition: transform 0.2s ease;
        }

        .pending-animation {
            animation: dashmove 1.5s linear infinite;
        }

        @keyframes dashmove {
            to {
                stroke-dashoffset: -20;
            }
        }

        /* for accept/decline pair */
        .icon-pair {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            width: 100%;
        }
        .icon-pair svg {
            width: 40px;
            height: 40px;
        }
    </style>
</head>
<body>
    <h1>📁 vault · icons</h1>
    <div class="grid">

        <!-- 1. App Logo – folded corner -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <rect x="8" y="8" width="44" height="44" stroke="black" fill="none" />
                    <polygon points="44,18 44,8 52,8 44,18" fill="#e0b7a2" stroke="black" />
                    <line x1="44" y1="18" x2="52" y2="8" stroke="black" />
                </svg>
            </div>
            <div class="icon-label">logo</div>
        </div>

        <!-- 2. Button Arrow – fat arrowhead -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <line x1="12" y1="32" x2="44" y2="32" stroke="black" stroke-width="5" />
                    <polygon points="44,20 52,32 44,44" fill="none" stroke="black" stroke-width="4" />
                </svg>
            </div>
            <div class="icon-label">arrow</div>
        </div>

        <!-- 3. Refresh & animation – curling page (hover to lift corner) -->
        <div class="icon-card refresh-hover">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <rect x="10" y="10" width="40" height="40" stroke="black" fill="none" />
                    <path d="M42 18 L50 10 L50 20 L42 18" fill="#b8c9c1" stroke="black" class="curl-corner" style="transition: transform 0.2s;" />
                </svg>
            </div>
            <div class="icon-label">refresh · hover</div>
        </div>

        <!-- 4. Eyeball icon – simple line eye with halftone dot -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="18" stroke="black" fill="none" />
                    <circle cx="32" cy="32" r="6" stroke="black" fill="none" />
                    <!-- halftone suggestion: tiny dots -->
                    <circle cx="24" cy="28" r="2" fill="black" stroke="none" />
                    <circle cx="40" cy="36" r="2" fill="black" stroke="none" />
                    <circle cx="38" cy="24" r="1.5" fill="black" stroke="none" />
                </svg>
            </div>
            <div class="icon-label">eyeball</div>
        </div>

        <!-- 5. Pockets – folder with tab -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <rect x="12" y="22" width="40" height="28" stroke="black" fill="none" />
                    <polygon points="22,22 32,12 42,22" fill="none" stroke="black" />
                    <line x1="32" y1="12" x2="32" y2="22" stroke="black" />
                </svg>
            </div>
            <div class="icon-label">pockets</div>
        </div>

        <!-- 6. Inbox icon – tray with letter -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <polygon points="12,38 20,24 44,24 52,38 12,38" stroke="black" fill="none" />
                    <rect x="20" y="28" width="24" height="10" stroke="black" fill="none" />
                    <line x1="20" y1="32" x2="44" y2="32" stroke="black" stroke-dasharray="2 2" />
                </svg>
            </div>
            <div class="icon-label">inbox</div>
        </div>

        <!-- 7. Folder/binder – tabbed divider with rings -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <rect x="12" y="20" width="40" height="30" stroke="black" fill="none" />
                    <polygon points="22,20 32,10 42,20" fill="none" stroke="black" />
                    <circle cx="24" cy="32" r="4" stroke="black" fill="none" />
                    <circle cx="40" cy="32" r="4" stroke="black" fill="none" />
                    <line x1="24" y1="36" x2="24" y2="44" stroke="black" />
                    <line x1="40" y1="36" x2="40" y2="44" stroke="black" />
                </svg>
            </div>
            <div class="icon-label">binder</div>
        </div>

        <!-- 8. Vault icon – filing cabinet -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <rect x="16" y="12" width="32" height="40" stroke="black" fill="none" />
                    <line x1="16" y1="28" x2="48" y2="28" stroke="black" />
                    <line x1="16" y1="44" x2="48" y2="44" stroke="black" />
                    <circle cx="38" cy="20" r="3" stroke="black" fill="none" />
                    <circle cx="38" cy="36" r="3" stroke="black" fill="none" />
                </svg>
            </div>
            <div class="icon-label">vault</div>
        </div>

        <!-- 9. Add icon – chunky plus -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <line x1="32" y1="16" x2="32" y2="48" stroke="black" stroke-width="5" />
                    <line x1="16" y1="32" x2="48" y2="32" stroke="black" stroke-width="5" />
                </svg>
            </div>
            <div class="icon-label">add</div>
        </div>

        <!-- 10. Accept / Decline – pair inside one card -->
        <div class="icon-card">
            <div class="icon-pair">
                <!-- accept check -->
                <svg viewBox="0 0 40 40">
                    <polyline points="6,20 16,30 34,10" stroke="black" stroke-width="4" fill="none" />
                </svg>
                <!-- decline x -->
                <svg viewBox="0 0 40 40">
                    <line x1="8" y1="8" x2="32" y2="32" stroke="black" stroke-width="4" />
                    <line x1="32" y1="8" x2="8" y2="32" stroke="black" stroke-width="4" />
                </svg>
            </div>
            <div class="icon-label">accept / decline</div>
        </div>

        <!-- 11. Pending animation – moving dashed circle -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="22" stroke="black" stroke-width="4" fill="none" stroke-dasharray="6 6" class="pending-animation" />
                    <circle cx="32" cy="32" r="8" stroke="black" stroke-width="3" fill="none" />
                </svg>
            </div>
            <div class="icon-label">pending · animated</div>
        </div>

        <!-- 12. Generator icon – machine dial -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="20" stroke="black" fill="none" stroke-width="4" />
                    <line x1="32" y1="32" x2="48" y2="24" stroke="black" stroke-width="3" />
                    <circle cx="32" cy="32" r="4" stroke="black" fill="none" />
                    <line x1="16" y1="20" x2="22" y2="26" stroke="black" stroke-width="2" />
                </svg>
            </div>
            <div class="icon-label">generator</div>
        </div>

        <!-- 13. Role icon – nametag with clip -->
        <div class="icon-card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 64 64">
                    <rect x="14" y="22" width="36" height="26" stroke="black" fill="none" rx="4" />
                    <line x1="20" y1="16" x2="20" y2="24" stroke="black" stroke-width="3" />
                    <circle cx="20" cy="14" r="4" stroke="black" fill="none" />
                    <line x1="28" y1="32" x2="44" y2="32" stroke="black" stroke-dasharray="2 2" />
                </svg>
            </div>
            <div class="icon-label">role</div>
        </div>

    </div>
    <!-- optional footer note -->
    <p style="margin-top: 4rem; border-top: 4px solid #1e1e1e; padding-top: 1rem; font-size: 0.9rem; text-transform: uppercase;">
        ⬤ neo‑brutalist · paper‑digital · bento grid · each icon is a physical stamp
    </p>
</body>
</html>
